[package]
name = "onerom-ostrich-tester"
version = "0.1.0"
edition = "2024"
# Building it requires CONFIG, BOARD and the One ROM checkout at
# ../build/one-rom that the plugin's make one-rom creates.
publish = false
license = "MIT"
description = "Runs the Ostrich plugin against the emulated One ROM firmware"

[[bin]]
name = "ostrich-tester"
path = "src/main.rs"

# build.rs uses the same One ROM checkout.
[dependencies]
onerom-config = { path = "../build/one-rom/rust/config" }
onerom-fw-emulator = { path = "../build/one-rom/rust/fw-emulator" }
onerom-metadata = { path = "../build/one-rom/rust/metadata" }
onerom-plugin-tester = { path = "../build/one-rom/rust/plugin-tester" }

log = "0.4"
env_logger = "0.11"

# Not part of any workspace above this directory.
[workspace]
